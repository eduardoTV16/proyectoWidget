<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>
    <link rel="stylesheet" href="css/style-tasks.css">
</head>
<body>

    <div class="task-container">
        <header class="task-header">
            <h1>Mis tareas</h1>
            <p>Hoy tienes pendiente:...</p>
        </header>

        <div class="task-input">
            <input type="text" placeholder="Agregar tarea nueva ...">
            <button>Agregar</button>
        </div>

        <nav class="task-sections">
            <button>Todas</button>
            <button>Escuela</button>
            <button>Codigo</button>
            <button>Personal</button>
        </nav>

        <section class="tareas-lista">

            <div class="task-n">
                <input type="checkbox">
                <span>Jugar Fornite</span>
                <span class="prioridad-high">Alta</span>
            </div>

            <div class="task-n">
                <input type="checkbox">
                <span>Hacer Foda de Taller</span>
                <span class="prioridad-medium">Media</span>
            </div>

            <div class="task-n">
                <input type="checkbox">
                <span>Seguir mi dieta</span>
                <span class="prioridad-low">Baja</span>
            </div>

        </section>

    </div>
    
</body>
</html>
